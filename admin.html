<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة السيادية - دولة كِيُوشَان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #030712;
            --bg-card: #111827;
            --bg-card-alt: #1f2937;
            --primary-gold: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 1.5rem; line-height: 1.7; }

        #loginScreen {
            max-width: 420px;
            margin: 60px auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-group { margin-bottom: 1rem; text-align: right; }
        .login-group label { display: block; font-size: 0.85rem; color: var(--primary-gold); margin-bottom: 0.3rem; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 0.8rem; background: var(--bg-card-alt);
            border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 0.95rem;
        }
        button {
            background: var(--primary-gold); color: black; font-weight: bold;
            border: none; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer;
            font-size: 0.95rem; transition: background 0.3s;
        }
        button:hover { background: #d97706; }

        #adminDashboard { display: none; max-width: 960px; margin: 0 auto; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; margin-bottom: 1.2rem;
        }
        .card-box {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.2rem; margin-bottom: 1.2rem;
        }
        .card-box h3 { color: var(--primary-gold); margin-bottom: 0.8rem; font-size: 1.1rem; }

        .app-item {
            background: var(--bg-card-alt); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 1rem; margin-top: 0.8rem;
        }
        .answers-box {
            background: #090e1a; border-radius: 8px; padding: 0.8rem;
            margin-top: 0.7rem; font-size: 0.9rem;
        }
        .actions-row { display: flex; gap: 0.6rem; margin-top: 0.8rem; flex-wrap: wrap; }
        .btn-accept { background: #16a34a; color: #fff; }
        .btn-reject { background: #dc2626; color: #fff; }

        .msg-item {
            background: var(--bg-card-alt); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 0.9rem; margin-top: 0.7rem;
        }
        .msg-time { display: block; font-size: 0.78rem; color: var(--text-muted); margin-top: 0.35rem; }
    </style>
</head>
<body>

    <!-- شاشة التحقق الأمني السيادي -->
    <div id="loginScreen">
        <h2 style="color: var(--primary-gold); margin-bottom: 0.5rem; text-align: center;">🛡️ البوابة السيادية المحمية</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; text-align: center;">مصادقة إدارية رسمية للوصول:</p>

        <div class="login-group">
            <label>الاسم السيادي المعتمد:</label>
            <input type="text" id="adminNameInput" placeholder="أدخل الاسم المعتمد">
        </div>

        <div class="login-group">
            <label>البريد الإلكتروني المعتمد:</label>
            <input type="email" id="adminEmailInput" placeholder="أدخل البريد الإلكتروني">
        </div>

        <div class="login-group">
            <label>رمز المرور السيادي:</label>
            <input type="password" id="adminPassInput" placeholder="كلمة المرور">
        </div>

        <button onclick="loginAdmin()" style="width: 100%; margin-top: 0.5rem;">تحقق ودخول الإدارة</button>
    </div>

    <!-- لوحة القيادة الرسمية -->
    <div id="adminDashboard">
        <div class="top-bar">
            <h1 style="color: var(--primary-gold); font-size: 1.45rem;">👑 إدارة دولة كِيُوشَان الرسمية</h1>
            <div style="display: flex; gap: 8px; align-items: center;">
                <a href="index.html" style="color: var(--primary-gold); text-decoration: none; font-weight: bold;">← صفحة الموقع</a>
                <button onclick="location.reload()" style="background: #ef4444; color: white;">تسجيل خروج</button>
            </div>
        </div>

        <!-- بث رسالة أو انتخابات في الشات الجماعي -->
        <div class="card-box">
            <h3>📢 بث رسالة أو انتخابات في الشات الجماعي (للمقبولين)</h3>
            <form id="broadcastForm" style="display: flex; flex-direction: column; gap: 0.7rem;">
                <select id="messageType">
                    <option value="announcement">إعلان / رسالة إدارية</option>
                    <option value="election">انتخابات / استفتاء تصويت</option>
                </select>
                <textarea id="broadcastText" rows="2" placeholder="اكتب نص الرسالة أو موضوع الانتخابات..." required></textarea>
                <input type="text" id="pollOptions" placeholder="خيارات الانتخابات مفصولة بفاصلة (مثال: المرشح أ، المرشح ب، امتناع)" />
                <button type="submit">إرسال إلى الشات الجماعي</button>
            </form>
            <div id="adminMessagesList" style="margin-top: 1rem;"></div>
        </div>

        <!-- طلبات المتقدمين وإجابات الأسئلة -->
        <div class="card-box">
            <h3>📋 طلبات المتقدمين وإجابات الأسئلة</h3>
            <div id="applicationsList"></div>
        </div>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://rrwessrapdcozozcxlcq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_QPjklI2G5v0kC8S7I9-T1A_rZR7aJUN";
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.loginAdmin = function() {
            const enteredName = document.getElementById('adminNameInput').value.trim();
            const enteredEmail = document.getElementById('adminEmailInput').value.trim();
            const enteredPass = document.getElementById('adminPassInput').value;

            const validName = "فلجكا ليث عويس كيوشان";
            const validEmail = "laithowaisn@gmail.com";
            const validPass = "kyvosh2026";

            if (enteredName === validName && enteredEmail === validEmail && enteredPass === validPass) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadApplications();
                loadAdminMessages();
                subscribeRealtime();
            } else {
                alert('خطأ في إحدى البيانات السيادية (الاسم، البريد، أو رمز المرور)!');
            }
        };

        function formatTime(isoStr) {
            if (!isoStr) return "";
            return new Date(isoStr).toLocaleString("ar-EG", {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function statusLabel(status) {
            if (status === "accepted") return `<span style="color:#4ade80; font-weight:bold;">مقبول</span>`;
            if (status === "rejected") return `<span style="color:#f87171; font-weight:bold;">مرفوض</span>`;
            return `<span style="color:#fbbf24; font-weight:bold;">قيد المراجعة</span>`;
        }

        async function loadApplications() {
            const { data, error } = await supabase
                .from("applications")
                .select("*")
                .order("created_at", { ascending: false });

            if (error || !data) return;

            const listEl = document.getElementById("applicationsList");
            if (data.length === 0) {
                listEl.innerHTML = `<p style="color:var(--text-muted);">لا توجد طلبات حتى الآن.</p>`;
                return;
            }

            listEl.innerHTML = data.map(app => {
                const answersHtml = Array.isArray(app.answers) && app.answers.length > 0
                    ? app.answers.map((a, idx) => `
                        <div><strong>س${idx + 1}:</strong> ${a.question}<br/><span style="color:#fde68a;">الجواب:</span> ${a.answer}</div>
                    `).join(`<hr style="border-color:#1f2937; margin:6px 0;">`)
                    : `<span style="color:var(--text-muted);">لم يُجب عن الأسئلة بعد.</span>`;

                return `
                    <div class="app-item">
                        <div><strong>الاسم:</strong> ${app.full_name} — <strong>الحالة:</strong> ${statusLabel(app.status)}</div>
                        <div><strong>الدولة/المجال:</strong> ${app.subject}</div>
                        <div><strong>التفاصيل:</strong> ${app.details}</div>
                        <span class="msg-time">🕒 وقت التقديم: ${formatTime(app.created_at)}</span>
                        <div class="answers-box">${answersHtml}</div>
                        <div class="actions-row">
                            <button class="btn-accept" onclick="window.updateAppStatus('${app.id}', 'accepted')">قبول</button>
                            <button class="btn-reject" onclick="window.updateAppStatus('${app.id}', 'rejected')">رفض</button>
                        </div>
                    </div>
                `;
            }).join("");
        }

        window.updateAppStatus = async function(id, status) {
            const { error } = await supabase
                .from("applications")
                .update({ status })
                .eq("id", id);

            if (error) {
                alert("خطأ في تحديث الحالة: " + error.message);
                return;
            }
            loadApplications();
        };

        document.getElementById("broadcastForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const messageType = document.getElementById("messageType").value;
            const text = document.getElementById("broadcastText").value.trim();
            const rawOptions = document.getElementById("pollOptions").value.trim();
            const options = messageType === "election"
                ? rawOptions.split("،").join(",").split(",").map(s => s.trim()).filter(Boolean)
                : [];

            const { error } = await supabase
                .from("group_messages")
                .insert([{
                    sender: "الإدارة السيادية - كِيُوشَان",
                    message_type: messageType,
                    text,
                    options
                }]);

            if (error) {
                alert("تعذر إرسال الرسالة: " + error.message);
                return;
            }

            e.target.reset();
            loadAdminMessages();
        });

        async function loadAdminMessages() {
            const { data: messages } = await supabase
                .from("group_messages")
                .select("*")
                .order("created_at", { ascending: false });

            const { data: votes } = await supabase.from("poll_votes").select("*");
            const allVotes = votes || [];

            const el = document.getElementById("adminMessagesList");
            if (!messages || messages.length === 0) {
                el.innerHTML = `<p style="color:var(--text-muted);">لا توجد رسائل مرسلة في الشات الجماعي بعد.</p>`;
                return;
            }

            el.innerHTML = messages.map(m => {
                let voteSummary = "";
                if (m.message_type === "election" && Array.isArray(m.options) && m.options.length > 0) {
                    const mVotes = allVotes.filter(v => v.message_id === m.id);
                    voteSummary = `<div style="margin-top:6px; font-size:0.88rem; color:#93c5fd;">نتائج التصويت: ` +
                        m.options.map(opt => `${opt} (${mVotes.filter(v => v.choice === opt).length})`).join(" | ") +
                        `</div>`;
                }
                return `
                    <div class="msg-item">
                        <div><strong>[${m.message_type === "election" ? "انتخابات" : "إعلان"}]</strong> ${m.text}</div>
                        ${voteSummary}
                        <span class="msg-time">🕒 وقت الإرسال: ${formatTime(m.created_at)}</span>
                    </div>
                `;
            }).join("");
        }

        function subscribeRealtime() {
            supabase
                .channel("kyushan-admin-rt")
                .on("postgres_changes", { event: "*", schema: "public", table: "applications" }, loadApplications)
                .on("postgres_changes", { event: "*", schema: "public", table: "group_messages" }, loadAdminMessages)
                .on("postgres_changes", { event: "*", schema: "public", table: "poll_votes" }, loadAdminMessages)
                .subscribe();
        }
    </script>
</body>
</html>
