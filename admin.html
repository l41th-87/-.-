<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة السيادية - دولة كِيُوشَان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #030712;
            --bg-card: #111827;
            --bg-card-alt: #1f2937;
            --primary-gold: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 1.5rem; }

        #loginScreen {
            max-width: 420px;
            margin: 80px auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-group { margin-bottom: 1rem; text-align: right; }
        .login-group label { display: block; font-size: 0.85rem; color: var(--primary-gold); margin-bottom: 0.3rem; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 0.8rem; background: var(--bg-card-alt); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 0.95rem; }
        button { background: var(--primary-gold); color: black; font-weight: bold; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: background 0.3s; }
        button:hover { background: #d97706; }

        #adminDashboard { display: none; }
        .admin-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1rem; }
        @media (min-width: 768px) { .admin-grid { grid-template-columns: 320px 1fr; min-height: calc(100vh - 140px); } }

        .sidebar { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow-y: auto; max-height: 450px; }
        @media (min-width: 768px) { .sidebar { max-height: none; } }

        .applicant-item { padding: 1rem; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .applicant-item:hover { background: rgba(251,191,36,0.1); }

        .chat-area { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; }
        .msg-time { display: block; font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem; }
    </style>
</head>
<body>

    <!-- شاشة التحقق الأمني السيادي -->
    <div id="loginScreen">
        <h2 style="color: var(--primary-gold); margin-bottom: 0.5rem; text-align: center;">🛡️ البوابة السيادية المحمية</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; text-align: center;">مصادقة إدارية رسمية للوصول:</p>

        <div class="login-group">
            <label>الاسم السيادي المعتمد:</label>
            <input type="text" id="adminNameInput" placeholder="أدخل الاسم المعتمد">
        </div>

        <div class="login-group">
            <label>البريد الإلكتروني المعتمد:</label>
            <input type="email" id="adminEmailInput" placeholder="أدخل البريد الإلكتروني">
        </div>

        <div class="login-group">
            <label>رمز المرور السيادي:</label>
            <input type="password" id="adminPassInput" placeholder="كلمة المرور">
        </div>

        <button onclick="loginAdmin()" style="width: 100%; margin-top: 0.5rem;">تحقق ودخول الإدارة</button>
    </div>

    <!-- لوحة القيادة الرسمية -->
    <div id="adminDashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;">
            <h1 style="color: var(--primary-gold); font-size: 1.5rem;">👑 إدارة دولة كِيُوشَان الرسمية</h1>
            <button onclick="location.reload()" style="width: auto; background: #ef4444; color: white;">تسجيل خروج</button>
        </div>

        <div class="admin-grid">
            <div class="sidebar" id="applicantsList"></div>

            <div class="chat-area">
                <div style="background: var(--bg-card-alt); padding: 1rem; border-radius: 10px; border: 1px solid var(--border-color);">
                    <h3 style="color: var(--primary-gold); margin-bottom: 0.7rem; font-size: 1.05rem;">📢 بث رسالة أو انتخابات في الشات الجماعي (للمقبولين)</h3>
                    <form id="broadcastForm" style="display: flex; flex-direction: column; gap: 0.6rem;">
                        <select id="messageType">
                            <option value="announcement">إعلان / رسالة إدارية</option>
                            <option value="election">انتخابات / تصويت</option>
                        </select>
                        <textarea id="broadcastText" rows="2" placeholder="اكتب الرسالة أو موضوع الانتخابات..." required></textarea>
                        <input type="text" id="pollOptions" placeholder="خيارات الانتخابات مفصولة بفاصلة (مثال: مرشح 1، مرشح 2)">
                        <button type="submit" style="width: auto;">إرسال إلى الشات الجماعي</button>
                    </form>
                    <div id="adminBroadcastList" style="margin-top: 0.8rem;"></div>
                </div>

                <div id="applicantDetailBox" style="background: var(--bg-card-alt); padding: 1rem; border-radius: 10px; border: 1px solid var(--border-color);">
                    <div id="chatHeader" style="font-weight: bold; color: var(--primary-gold); margin-bottom: 0.5rem;">اختر متقدماً من القائمة</div>
                    <div id="applicantInfo" style="font-size: 0.9rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://rrwessrapdcozozcxlcq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_QPjklI2G5v0kC8S7I9-T1A_rZR7aJUN";
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedAppId = null;

        window.loginAdmin = function() {
            const enteredName = document.getElementById('adminNameInput').value.trim();
            const enteredEmail = document.getElementById('adminEmailInput').value.trim();
            const enteredPass = document.getElementById('adminPassInput').value;

            const validName = "فلجكا ليث عويس كيوشان";
            const validEmail = "laithowaisn@gmail.com";
            const validPass = "kyvosh2026";

            if (enteredName === validName && enteredEmail === validEmail && enteredPass === validPass) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadAdminData();
            } else {
                alert('خطأ في إحدى البيانات السيادية (الاسم، البريد، أو رمز المرور)!');
            }
        };

        function formatTime(isoStr) {
            if (!isoStr) return "";
            return new Date(isoStr).toLocaleString("ar-EG", {
                year: "numeric", month: "short", day: "numeric",
                hour: "2-digit", minute: "2-digit"
            });
        }

        async function loadAdminData() {
            await loadApplicants();
            await loadBroadcasts();

            supabase
                .channel("kyushan-admin-channel")
                .on("postgres_changes", { event: "*", schema: "public", table: "applications" }, loadApplicants)
                .on("postgres_changes", { event: "*", schema: "public", table: "group_messages" }, loadBroadcasts)
                .on("postgres_changes", { event: "*", schema: "public", table: "poll_votes" }, loadBroadcasts)
                .subscribe();
        }

        async function loadApplicants() {
            const { data, error } = await supabase
                .from("applications")
                .select("*")
                .order("created_at", { ascending: false });

            const list = document.getElementById("applicantsList");
            list.innerHTML = "";

            if (error || !data || data.length === 0) {
                list.innerHTML = '<div style="padding:1rem; color:var(--text-muted);">لا توجد طلبات رسمية حتى الآن.</div>';
                return;
            }

            data.forEach(a => {
                const div = document.createElement("div");
                div.className = "applicant-item";
                const st = a.status === "accepted" ? "مقبول" : (a.status === "rejected" ? "مرفوض" : "قيد المراجعة");
                div.innerHTML = `<strong>${a.full_name}</strong> (${st})<br><small style="color:var(--text-muted);">${a.subject || ''} - ${formatTime(a.created_at)}</small>`;
                div.onclick = () => selectApp(a);
                list.appendChild(div);
            });

            if (selectedAppId) {
                const current = data.find(item => item.id === selectedAppId);
                if (current) selectApp(current);
            }
        }

        function selectApp(app) {
            selectedAppId = app.id;
            document.getElementById("chatHeader").innerText = `طلب المتقدم: ${app.full_name}`;

            const answersHtml = Array.isArray(app.answers) && app.answers.length > 0
                ? app.answers.map((item, i) => `<div style="margin-top:6px;"><strong>س${i + 1}: ${item.question}</strong><br><span style="color:#fde68a;">الجواب: ${item.answer}</span></div>`).join("")
                : `<div style="color:var(--text-muted); margin-top:6px;">لم يجب عن الأسئلة بعد.</div>`;

            document.getElementById("applicantInfo").innerHTML = `
                <div><strong>الدولة:</strong> ${app.subject || ''}</div>
                <div><strong>التفاصيل:</strong> ${app.details || ''}</div>
                <div><strong>وقت الإرسال:</strong> ${formatTime(app.created_at)}</div>
                <div><strong>الحالة:</strong> ${app.status}</div>
                <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--border-color);"><strong>إجابات الأسئلة:</strong>${answersHtml}</div>
                <div style="display:flex; gap:8px; margin-top:12px;">
                    <button type="button" style="width:auto; background:#16a34a; color:#fff;" onclick="window.setStatus('${app.id}', 'accepted')">قبول</button>
                    <button type="button" style="width:auto; background:#dc2626; color:#fff;" onclick="window.setStatus('${app.id}', 'rejected')">رفض</button>
                </div>
            `;
        }

        window.setStatus = async function(id, status) {
            const { error } = await supabase
                .from("applications")
                .update({ status })
                .eq("id", id);
            if (error) {
                alert("خطأ في تحديث الحالة: " + error.message);
                return;
            }
            loadApplicants();
        };

        document.getElementById("broadcastForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const messageType = document.getElementById("messageType").value;
            const text = document.getElementById("broadcastText").value.trim();
            const rawOpts = document.getElementById("pollOptions").value.trim();
            const options = messageType === "election"
                ? rawOpts.split("،").join(",").split(",").map(s => s.trim()).filter(Boolean)
                : [];

            const { error } = await supabase
                .from("group_messages")
                .insert([{
                    sender: "الإدارة السيادية - كِيُوشَان",
                    message_type: messageType,
                    text,
                    options
                }]);

            if (error) {
                alert("خطأ في الإرسال: " + error.message);
                return;
            }

            e.target.reset();
            loadBroadcasts();
        });

        async function loadBroadcasts() {
            const { data: messages } = await supabase
                .from("group_messages")
                .select("*")
                .order("created_at", { ascending: false });
            const { data: votes } = await supabase.from("poll_votes").select("*");
            const allVotes = votes || [];

            const el = document.getElementById("adminBroadcastList");
            if (!messages || messages.length === 0) {
                el.innerHTML = `<div style="color:var(--text-muted); font-size:0.88rem;">لا توجد رسائل أو انتخابات مرسلة بعد.</div>`;
                return;
            }

            el.innerHTML = messages.map(m => {
                let voteLine = "";
                if (m.message_type === "election" && Array.isArray(m.options) && m.options.length > 0) {
                    const mVotes = allVotes.filter(v => v.message_id === m.id);
                    voteLine = `<div style="font-size:0.85rem; color:#93c5fd; margin-top:4px;">الأصوات: ` +
                        m.options.map(o => `${o} (${mVotes.filter(v => v.choice === o).length})`).join(" | ") + `</div>`;
                }
                return `
                    <div style="background:#090e1a; padding:0.75rem; border-radius:8px; margin-top:0.6rem; border:1px solid var(--border-color);">
                        <div><strong>[${m.message_type === "election" ? "انتخابات" : "إعلان"}]</strong> ${m.text}</div>
                        ${voteLine}
                        <span class="msg-time">وقت الإرسال: ${formatTime(m.created_at)}</span>
                    </div>
                `;
            }).join("");
        }
    </script>
</body>
</html>
