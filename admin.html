<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم الإدارة السيادية - كِيُوشَان</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131b31;
      --panel-2: #192440;
      --text: #f3f6ff;
      --muted: #9fb0d6;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(160deg, var(--bg), #060913);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .login-box {
      max-width: 420px;
      margin: 60px auto;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    input, textarea, select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      margin-bottom: 14px;
      font-size: 0.95rem;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      color: #07111f;
      background: var(--accent);
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-accept {
      background: var(--accent-2);
      color: #05160c;
    }

    .btn-reject {
      background: var(--danger);
      color: #fff;
    }

    .btn-pending {
      background: var(--warn);
      color: #1b1102;
    }

    .btn-logout {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }

    .status-accepted {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }

    .status-rejected {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .app-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .msg-error {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .msg-ok {
      color: #86efac;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    pre {
      background: var(--bg);
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.82rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- شاشة التحقق الأولي -->
    <div id="loadingScreen" class="card login-box">
      <h2>جارٍ التحقق من الجلسة...</h2>
      <p>يتم التحقق من صلاحية الدخول عبر الخادم.</p>
    </div>

    <!-- شاشة تسجيل الدخول للمشرف -->
    <div id="loginScreen" class="card login-box hidden">
      <h2>دخول الإدارة السيادية - كِيُوشَان</h2>
      <p>سجّل الدخول بحساب المشرف المسجل في Supabase للوصول إلى لوحة التحكم.</p>
      <div id="loginError" class="msg-error hidden"></div>
      <form id="loginForm">
        <label for="emailInput">البريد الإلكتروني</label>
        <input id="emailInput" type="email" required autocomplete="username" placeholder="admin@example.com" />

        <label for="passwordInput">كلمة المرور</label>
        <input id="passwordInput" type="password" required autocomplete="current-password" placeholder="••••••••" />

        <button id="loginBtn" type="submit" style="width: 100%;">تسجيل الدخول</button>
      </form>
    </div>

    <!-- لوحة التحكم المحمية -->
    <div id="dashboardScreen" class="hidden">
      <div class="card topbar">
        <div>
          <h1>لوحة التحكم - كِيُوشَان</h1>
          <p id="adminInfo" style="margin: 0;"></p>
        </div>
        <button id="logoutBtn" class="btn-logout" type="button">تسجيل الخروج</button>
      </div>

      <div id="dashNotice" class="msg-ok hidden"></div>
      <div id="dashError" class="msg-error hidden"></div>

      <!-- إدارة الطلبات -->
      <div class="card">
        <h2>طلبات الجنسية والانضمام</h2>
        <div id="applicationsList">جارٍ تحميل الطلبات...</div>
      </div>

      <!-- بث إعلان أو انتخابات للشات الجماعي -->
      <div class="card">
        <h2>إرسال إعلان أو تصويت للشات الجماعي</h2>
        <form id="broadcastForm">
          <label for="msgType">نوع الرسالة</label>
          <select id="msgType">
            <option value="announcement">إعلان رسمي</option>
            <option value="poll">استطلاع / انتخابات</option>
          </select>

          <label for="msgText">نص الإعلان أو سؤال التصويت</label>
          <textarea id="msgText" rows="3" required placeholder="اكتب الرسالة هنا..."></textarea>

          <div id="pollOptionsBox" class="hidden">
            <label for="pollOptionsInput">خيارات التصويت (افصل بين الخيارات بفاصلة)</label>
            <input id="pollOptionsInput" type="text" placeholder="مثال: موافق, غير موافق, امتناع" />
          </div>

          <button id="sendBroadcastBtn" type="submit">نشر في الشات الجماعي</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rrwessrapdcozozcxlcq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QPjklI2G5v0kC8S7I9-T1A_rZR7aJUN";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loadingScreen = document.getElementById("loadingScreen");
    const loginScreen = document.getElementById("loginScreen");
    const dashboardScreen = document.getElementById("dashboardScreen");
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminInfo = document.getElementById("adminInfo");
    const applicationsList = document.getElementById("applicationsList");
    const broadcastForm = document.getElementById("broadcastForm");
    const msgType = document.getElementById("msgType");
    const pollOptionsBox = document.getElementById("pollOptionsBox");
    const dashNotice = document.getElementById("dashNotice");
    const dashError = document.getElementById("dashError");

    let realtimeChannel = null;

    function showNotice(text) {
      dashError.classList.add("hidden");
      dashNotice.textContent = text;
      dashNotice.classList.remove("hidden");
    }

    function showError(text) {
      dashNotice.classList.add("hidden");
      dashError.textContent = text;
      dashError.classList.remove("hidden");
    }

    function showLoginError(text) {
      loginError.textContent = text;
      loginError.classList.remove("hidden");
    }

    function clearMessages() {
      loginError.classList.add("hidden");
      dashNotice.classList.add("hidden");
      dashError.classList.add("hidden");
    }

    function renderAuthState(session) {
      loadingScreen.classList.add("hidden");
      clearMessages();

      if (session && session.user) {
        loginScreen.classList.add("hidden");
        dashboardScreen.classList.remove("hidden");
        adminInfo.textContent = `تم التحقق عبر الخادم — الحساب: ${session.user.email}`;
        loadApplications();
        subscribeRealtime();
      } else {
        dashboardScreen.classList.add("hidden");
        loginScreen.classList.remove("hidden");
        applicationsList.innerHTML = "";
        if (realtimeChannel) {
          supabaseClient.removeChannel(realtimeChannel);
          realtimeChannel = null;
        }
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function statusBadge(status) {
      const s = (status || "pending").toLowerCase();
      if (s === "accepted") return `<span class="badge status-accepted">مقبول</span>`;
      if (s === "rejected") return `<span class="badge status-rejected">مرفوض</span>`;
      return `<span class="badge status-pending">قيد الانتظار</span>`;
    }

    async function loadApplications() {
      applicationsList.innerHTML = "جارٍ تحميل الطلبات...";
      const { data, error } = await supabaseClient
        .from("applications")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        applicationsList.innerHTML = `<div class="msg-error">تعذر جلب الطلبات: ${escapeHtml(error.message)}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        applicationsList.innerHTML = "<p>لا توجد طلبات مقدمة حتى الآن.</p>";
        return;
      }

      applicationsList.innerHTML = data.map((app) => `
        <div class="app-item">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
            <strong>${escapeHtml(app.full_name)}</strong>
            ${statusBadge(app.status)}
          </div>
          <p style="margin:6px 0;"><strong>الموضوع:</strong> ${escapeHtml(app.subject)}</p>
          <p style="margin:6px 0;"><strong>التفاصيل:</strong> ${escapeHtml(app.details)}</p>
          <details style="margin-top:8px;">
            <summary style="cursor:pointer; color:var(--accent);">إجابات الاختبار</summary>
            <pre>${escapeHtml(JSON.stringify(app.answers ?? [], null, 2))}</pre>
          </details>
          <div class="actions">
            <button class="btn-accept" type="button" onclick="updateStatus('${app.id}', 'accepted')">قبول</button>
            <button class="btn-reject" type="button" onclick="updateStatus('${app.id}', 'rejected')">رفض</button>
            <button class="btn-pending" type="button" onclick="updateStatus('${app.id}', 'pending')">قيد الانتظار</button>
          </div>
        </div>
      `).join("");
    }

    window.updateStatus = async function(id, nextStatus) {
      const { error } = await supabaseClient
        .from("applications")
        .update({ status: nextStatus })
        .eq("id", id);

      if (error) {
        showError(`فشل تحديث حالة الطلب: ${error.message}`);
        return;
      }
      showNotice("تم تحديث حالة الطلب بنجاح.");
      await loadApplications();
    };

    function subscribeRealtime() {
      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
      }
      realtimeChannel = supabaseClient
        .channel("admin-applications-channel")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "applications" },
          () => {
            loadApplications();
          }
        )
        .subscribe();
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("hidden");
      loginBtn.disabled = true;
      loginBtn.textContent = "جارٍ التحقق...";

      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      loginBtn.disabled = false;
      loginBtn.textContent = "تسجيل الدخول";

      if (error) {
        showLoginError("بيانات الدخول غير صحيحة أو الحساب غير مفعل في السيرفر.");
        return;
      }

      renderAuthState(data.session);
    });

    logoutBtn.addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      renderAuthState(null);
    });

    msgType.addEventListener("change", () => {
      if (msgType.value === "poll") {
        pollOptionsBox.classList.remove("hidden");
      } else {
        pollOptionsBox.classList.add("hidden");
      }
    });

    broadcastForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const type = msgType.value;
      const text = document.getElementById("msgText").value.trim();
      const rawOptions = document.getElementById("pollOptionsInput").value.trim();

      let options = [];
      if (type === "poll") {
        options = rawOptions
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);

        if (options.length < 2) {
          showError("يرجى إدخال خيارين على الأقل مفصولين بفاصلة للتصويت.");
          return;
        }
      }

      const sendBtn = document.getElementById("sendBroadcastBtn");
      sendBtn.disabled = true;

      const { error } = await supabaseClient
        .from("group_messages")
        .insert({
          sender: "الإدارة السيادية - كِيُوشَان",
          message_type: type,
          text,
          options
        });

      sendBtn.disabled = false;

      if (error) {
        showError(`فشل نشر الرسالة: ${error.message}`);
        return;
      }

      document.getElementById("msgText").value = "";
      document.getElementById("pollOptionsInput").value = "";
      showNotice("تم نشر الرسالة بنجاح في الشات الجماعي.");
    });

    // التحقق الفوري من الجلسة عند فتح الصفحة ومراقبة أي تغيير في الجلسة
    (async function initAuth() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        renderAuthState(null);
        return;
      }
      renderAuthState(data.session);

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        renderAuthState(session);
      });
    })();
  </script>
</body>
</html>
