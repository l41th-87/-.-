<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة السيادية - دولة كِيُوشَان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #030712;
            --bg-card: #111827;
            --bg-card-alt: #1f2937;
            --primary-gold: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 1.5rem; }
        
        #loginScreen {
            max-width: 420px;
            margin: 80px auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-group { margin-bottom: 1rem; text-align: right; }
        .login-group label { display: block; font-size: 0.85rem; color: var(--primary-gold); margin-bottom: 0.3rem; font-weight: bold; }
        input, textarea { width: 100%; padding: 0.8rem; background: var(--bg-card-alt); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 0.95rem; }
        button { background: var(--primary-gold); color: black; font-weight: bold; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; transition: background 0.3s; }
        button:hover { background: #d97706; }
        
        #adminDashboard { display: none; }
        .admin-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1rem; }
        @media (min-width: 768px) { .admin-grid { grid-template-columns: 320px 1fr; height: calc(100vh - 140px); } }
        
        .sidebar { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow-y: auto; max-height: 400px; }
        @media (min-width: 768px) { .sidebar { max-height: none; } }
        
        .applicant-item { padding: 1rem; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .applicant-item:hover { background: rgba(251,191,36,0.1); }
        
        .chat-area { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; height: 500px; }
        @media (min-width: 768px) { .chat-area { height: auto; } }
        
        .chat-box { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; background: #090e1a; }
        .msg { max-width: 80%; padding: 0.7rem 1rem; border-radius: 10px; font-size: 0.95rem; }
        .msg.in { background: #334155; align-self: flex-start; }
        .msg.out { background: #1e40af; align-self: flex-end; }
        .msg-img { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 0.4rem; cursor: pointer; }
    </style>
</head>
<body>


    <!-- شاشة التحقق الأمني السيادي -->
    <div id="loginScreen">
        <h2 style="color: var(--primary-gold); margin-bottom: 0.5rem; text-align: center;">🛡️ البوابة السيادية المحمية</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; text-align: center;">مصادقة إدارية رسمية للوصول:</p>
        
        <div class="login-group">
            <label>الاسم السيادي المعتمد:</label>
            <input type="text" id="adminNameInput" placeholder="أدخل الاسم المعتمد">
        </div>


        <div class="login-group">
            <label>البريد الإلكتروني المعتمد:</label>
            <input type="email" id="adminEmailInput" placeholder="أدخل البريد الإلكتروني">
        </div>


        <div class="login-group">
            <label>رمز المرور السيادي:</label>
            <input type="password" id="adminPassInput" placeholder="كلمة المرور">
        </div>


        <button onclick="loginAdmin()" style="margin-top: 0.5rem;">تحقق ودخول الإدارة</button>
    </div>


    <!-- لوحة القيادة الرسمية -->
    <div id="adminDashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;">
            <h1 style="color: var(--primary-gold); font-size: 1.5rem;">👑 إدارة دولة كِيُوشَان الرسمية</h1>
            <button onclick="location.reload()" style="width: auto; background: #ef4444; color: white;">تسجيل خروج</button>
        </div>


        <div style="background: var(--bg-card); padding: 1.2rem; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 1rem;">
            <h3 style="color: var(--primary-gold); margin-bottom: 0.8rem; font-size: 1.1rem;">⚙️ إدارة الأسعار والملاحظات الرسمية</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                <div>
                    <label style="font-size:0.85rem; color:var(--text-muted);">سعر المواطنة الفردية:</label>
                    <input type="text" id="priceSingle" placeholder="مثال: 0$ (مجاناً)">
                    <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-top:5px;">ملاحظة الفردية (اختياري):</label>
                    <textarea id="noteSingle" rows="2" placeholder="إعفاء استثنائي..."></textarea>
                </div>
                <div>
                    <label style="font-size:0.85rem; color:var(--text-muted);">سعر المواطنة العائلية:</label>
                    <input type="text" id="priceFamily" placeholder="مثال: 0$ (مجاناً)">
                    <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-top:5px;">ملاحظة العائلية (اختياري):</label>
                    <textarea id="noteFamily" rows="2" placeholder="تشمل حتى عائلة..."></textarea>
                </div>
            </div>
            <button onclick="saveCloudPrices()" style="width: auto; margin-top: 0.8rem;">حفظ وتحديث الموقع الرسمي</button>
        </div>


        <div class="admin-grid">
            <div class="sidebar" id="applicantsList"></div>
            <div class="chat-area">
                <div id="chatHeader" style="padding: 1rem; background: var(--bg-card-alt); border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--primary-gold);">اختر متقدماً</div>
                <div id="applicantInfo" style="padding: 0.8rem; background: #151d36; font-size: 0.88rem; border-bottom: 1px solid var(--border-color); display:none;"></div>
                <div class="chat-box" id="adminChatBox"></div>
                <div style="padding: 0.8rem; background: var(--bg-card-alt); display: flex; gap: 0.5rem; display:none;" id="adminFooter">
                    <input type="file" id="adminFile" accept="image/*" style="display:none;" onchange="sendAdminImg(event)">
                    <button onclick="document.getElementById('adminFile').click()" style="width: auto; background:#334155; color:white;">📷</button>
                    <input type="text" id="adminInput" placeholder="اكتب ردك هنا..." style="margin:0;">
                    <button onclick="sendAdminText()" style="width: auto;">إرسال</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


        const firebaseConfig = {
          apiKey: "AIzaSyBglolyIuZIJ802RuhO7sklFxB9GwS8EAE",
          authDomain: "kyushan-state.firebaseapp.com",
          databaseURL: "https://kyushan-state-default-rtdb.firebaseio.com",
          projectId: "kyushan-state",
          storageBucket: "kyushan-state.firebasestorage.app",
          messagingSenderId: "303493310895",
          appId: "1:303493310895:web:4dae4eea24873cbf77a75a",
          measurementId: "G-G04Z2BZMJB"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);


        let activeId = null;


        window.loginAdmin = function() {
            const enteredName = document.getElementById('adminNameInput').value.trim();
            const enteredEmail = document.getElementById('adminEmailInput').value.trim();
            const enteredPass = document.getElementById('adminPassInput').value;


            const validName = "فلجكا ليث عويس كيوشان";
            const validEmail = "laithowaisn@gmail.com";


            if (enteredName !== validName || enteredEmail !== validEmail) {
                alert('الاسم السيادي أو البريد الإلكتروني غير متطابق!');
                return;
            }


            signInWithEmailAndPassword(auth, enteredEmail, enteredPass)
                .then((userCredential) => {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                    loadAdminData();
                })
                .catch((error) => {
                    alert('كلمة المرور غير صحيحة أو فشل الاتصال بالنظام: ' + error.message);
                });
        };


        function loadAdminData() {
            get(ref(db, 'settings/pricing')).then((snapshot) => {
                if (snapshot.exists()) {
                    const p = snapshot.val();
                    document.getElementById('priceSingle').value = p.singlePrice || '';
                    document.getElementById('noteSingle').value = p.singleNote || '';
                    document.getElementById('priceFamily').value = p.familyPrice || '';
                    document.getElementById('noteFamily').value = p.familyNote || '';
                }
            });


            const appsRef = ref(db, 'applications');
            onValue(appsRef, (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('applicantsList');
                list.innerHTML = '';


                if(!data) {
                    list.innerHTML = '<div style="padding:1rem; color:var(--text-muted);">لا توجد طلبات رسمية حتى الآن.</div>';
                    return;
                }


                Object.values(data).forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'applicant-item';
                    div.innerHTML = `<strong>${a.fullName}</strong><br><small style="color:var(--text-muted);">${a.country} - ${a.id}</small>`;
                    div.onclick = () => selectApp(a.id);
                    list.appendChild(div);
                });
            });
        }


        window.saveCloudPrices = function() {
            const pricingData = {
                singlePrice: document.getElementById('priceSingle').value,
                singleNote: document.getElementById('noteSingle').value,
                familyPrice: document.getElementById('priceFamily').value,
                familyNote: document.getElementById('noteFamily').value
            };
            set(ref(db, 'settings/pricing'), pricingData).then(() => {
                alert('تم تحديث الأسعار والملاحظات الرسمية بنجاح!');
            });
        };


        function selectApp(id) {
            activeId = id;
            get(ref(db, `applications/${id}`)).then((snapshot) => {
                const app = snapshot.val();
                if(!app) return;


                document.getElementById('chatHeader').innerText = `متابعة طلب المواطن: ${app.fullName} (${app.id})`;
                const info = document.getElementById('applicantInfo');
                info.style.display = 'block';
                info.innerHTML = `البريد: ${app.email} | الدولة: ${app.country} | المهارات: ${app.skills}`;
                document.getElementById('adminFooter').style.display = 'flex';
                
                renderAdminChat(app);
            });
        }


        function renderAdminChat(app) {
            const box = document.getElementById('adminChatBox');
            box.innerHTML = '';
            if(app.chatHistory) {
                Object.values(app.chatHistory).forEach(m => {
                    const d = document.createElement('div');
                    d.className = `msg ${m.sender === 'user' ? 'in' : 'out'}`;
                    if(m.img) {
                        d.innerHTML = `<div><strong>${m.sender}:</strong> ${m.text || ''}</div><img src="${m.img}" class="msg-img" onclick="window.open('${m.img}')">`;
                    } else {
                        d.innerText = `${m.sender}: ${m.text}`;
                    }
                    box.appendChild(d);
                });
                box.scrollTop = box.scrollHeight;
            }
        }


        window.sendAdminText = function() {
            const inp = document.getElementById('adminInput');
            const txt = inp.value.trim();
            if(!txt || !activeId) return;


            const chatRef = ref(db, `applications/${activeId}/chatHistory`);
            const newKey = push(chatRef).key;
            set(ref(db, `applications/${activeId}/chatHistory/${newKey}`), { sender: 'admin', text: txt }).then(() => {
                inp.value = '';
                selectApp(activeId);
            });
        };


        window.sendAdminImg = function(e) {
            const file = e.target.files[0];
            if(!file || !activeId) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const chatRef = ref(db, `applications/${activeId}/chatHistory`);
                const newKey = push(chatRef).key;
                set(ref(db, `applications/${activeId}/chatHistory/${newKey}`), { sender: 'admin', text: '📷 [وثيقة أو رد رسمي من المجلس]', img: evt.target.result }).then(() => {
                    selectApp(activeId);
                });
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
